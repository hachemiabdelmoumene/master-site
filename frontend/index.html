<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'></polygon><polyline points='2 17 12 22 22 17'></polyline><polyline points='2 12 12 17 22 12'></polyline></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Info Hub — Cours, TD & Vidéos pour les 7 Masters Informatique</title>
    <meta name="description" content="Plateforme collaborative pour étudiants en Master Informatique : accédez aux polycopiés, TD, examens et vidéos YouTube organisés par spécialité (SSI, SII, IL, HPC, BIGDATA, BIOINFO, RSD)." />
    <meta name="keywords" content="master informatique, cours, TD, polycopié, drive, youtube, SSI, SII, IL, HPC, BIGDATA, BIOINFO, RSD" />
    <meta property="og:title" content="Master Info Hub — Ressources des 7 Masters Informatique" />
    <meta property="og:description" content="Plateforme collaborative pour étudiants : cours, TD, examens et vidéos organisés par spécialité." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0F19] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black min-h-screen">
    <div id="root">
      <!-- Premium Loading Screen — auto-removed when React mounts -->
      <div id="app-loader" style="
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0B0F19;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      ">
        <!-- Animated background gradients -->
        <div style="
          position: absolute; inset: 0; overflow: hidden; pointer-events: none;
        ">
          <div style="
            position: absolute; top: -40%; left: -20%; width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(56,189,248,0.12) 0%, transparent 70%);
            border-radius: 50%;
            animation: drift1 8s ease-in-out infinite;
          "></div>
          <div style="
            position: absolute; bottom: -30%; right: -15%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(139,92,246,0.10) 0%, transparent 70%);
            border-radius: 50%;
            animation: drift2 10s ease-in-out infinite;
          "></div>
          <div style="
            position: absolute; top: 30%; left: 50%; width: 40vw; height: 40vw;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 70%);
            border-radius: 50%;
            animation: drift3 6s ease-in-out infinite;
          "></div>
        </div>

        <!-- Orbital ring with particles -->
        <div style="
          position: relative; width: 160px; height: 160px;
          margin-bottom: 48px;
        ">
          <!-- Outer orbit -->
          <div style="
            position: absolute; inset: -20px;
            border: 1px solid rgba(56,189,248,0.1);
            border-radius: 50%;
            animation: spin 12s linear infinite;
          ">
            <div style="
              position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
              width: 8px; height: 8px; background: #38bdf8;
              border-radius: 50%; box-shadow: 0 0 12px 3px rgba(56,189,248,0.6);
            "></div>
          </div>
          <!-- Inner orbit -->
          <div style="
            position: absolute; inset: 5px;
            border: 1px solid rgba(139,92,246,0.08);
            border-radius: 50%;
            animation: spin 8s linear infinite reverse;
          ">
            <div style="
              position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
              width: 6px; height: 6px; background: #8b5cf6;
              border-radius: 50%; box-shadow: 0 0 10px 2px rgba(139,92,246,0.5);
            "></div>
          </div>

          <!-- Central glowing logo -->
          <div style="
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2s ease-in-out infinite;
          ">
            <div style="
              width: 80px; height: 80px;
              background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(139,92,246,0.15));
              border: 1px solid rgba(56,189,248,0.25);
              border-radius: 20px;
              display: flex; align-items: center; justify-content: center;
              box-shadow: 0 0 40px rgba(56,189,248,0.15), inset 0 0 20px rgba(56,189,248,0.05);
              backdrop-filter: blur(10px);
            ">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
              </svg>
            </div>
          </div>
        </div>

        <!-- Title -->
        <h1 style="
          font-size: 1.5rem; font-weight: 700;
          background: linear-gradient(135deg, #38bdf8, #8b5cf6, #06b6d4);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          background-clip: text;
          margin: 0 0 8px 0; letter-spacing: -0.02em;
        ">Master Info Hub</h1>

        <!-- Subtitle message -->
        <p id="loader-message" style="
          color: rgba(148,163,184,0.8); font-size: 0.875rem; font-weight: 400;
          margin: 0 0 32px 0; letter-spacing: 0.02em;
        ">Préparation de votre espace…</p>

        <!-- Progress bar -->
        <div style="
          width: 200px; height: 3px;
          background: rgba(30,41,59,0.6);
          border-radius: 2px; overflow: hidden;
          position: relative;
        ">
          <div style="
            position: absolute; inset: 0;
            background: linear-gradient(90deg, #38bdf8, #8b5cf6, #06b6d4);
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
            transform-origin: left;
          "></div>
        </div>

        <!-- Floating dots -->
        <div style="
          display: flex; gap: 6px; margin-top: 24px;
        ">
          <div style="width:5px;height:5px;border-radius:50%;background:#38bdf8;opacity:0.6;animation:dot 1.4s ease-in-out infinite;"></div>
          <div style="width:5px;height:5px;border-radius:50%;background:#8b5cf6;opacity:0.6;animation:dot 1.4s ease-in-out 0.2s infinite;"></div>
          <div style="width:5px;height:5px;border-radius:50%;background:#06b6d4;opacity:0.6;animation:dot 1.4s ease-in-out 0.4s infinite;"></div>
        </div>

        <style>
          @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
          }
          @keyframes drift1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(5vw, 3vw); }
          }
          @keyframes drift2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-4vw, -2vw); }
          }
          @keyframes drift3 {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
            50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
          }
          @keyframes progress {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(100%); }
          }
          @keyframes dot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.2); opacity: 1; }
          }
          @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; pointer-events: none; }
          }
        </style>

        <!-- Rotate messages while waiting -->
        <script>
          (function() {
            var msgs = [
              'Préparation de votre espace…',
              'Chargement des spécialités…',
              'Connexion au serveur…',
              'Récupération des ressources…',
              'Presque prêt…'
            ];
            var i = 0;
            var el = document.getElementById('loader-message');
            setInterval(function() {
              i = (i + 1) % msgs.length;
              if (el) {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.3s';
                setTimeout(function() {
                  el.textContent = msgs[i];
                  el.style.opacity = '1';
                }, 300);
              }
            }, 3000);
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
